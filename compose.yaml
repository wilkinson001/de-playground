# Data engineering playground. All ports bind to 127.0.0.1 only: several services have no auth.
# Services are grouped into profiles so each exercise
# starts only what it needs:  core | spark | clickhouse | streaming | spark-stream | tools
name: de-playground

x-secrets: &secrets
  env_file: .env

services:
  postgres:
    profiles: [core]
    image: pgvector/pgvector:0.8.6-pg18-trixie
    <<: *secrets
    environment:
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP and against the last database init creates: during first-boot init the image runs
      # a socket-only temporary server, which a plain pg_isready would wrongly report as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d dagster"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 1g

  seaweedfs:
    profiles: [core]
    image: chrislusf/seaweedfs:4.48
    <<: *secrets
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "127.0.0.1:8333:8333" # S3 gateway
      - "127.0.0.1:8888:8888" # filer UI
      - "127.0.0.1:9333:9333" # master UI
    volumes:
      - seaweeddata:/data
      - ./docker/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    environment:
      # Go's soft heap limit: GC works harder instead of growing past the container limit
      # (parallel Spark reads/writes otherwise got SeaweedFS OOM-killed at 1g).
      GOMEMLIMIT: 1600MiB
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    mem_limit: 2g

  lakekeeper-migrate:
    profiles: [core]
    image: &lakekeeper-image quay.io/lakekeeper/catalog:v0.14.2
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  lakekeeper:
    profiles: [core]
    image: *lakekeeper-image
    environment: *lakekeeper-env
    command: ["serve"]
    ports: ["127.0.0.1:8181:8181"] # REST catalog at /catalog, UI at /ui
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 30
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}
      seaweedfs: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m

  spark-connect:
    profiles: [spark]
    build:
      context: docker/spark
    image: de-playground/spark-connect:4.0.1
    <<: *secrets
    volumes:
      - sparkcheckpoints:/opt/spark/checkpoints # Structured Streaming checkpoints
    ports:
      - "127.0.0.1:15002:15002" # Spark Connect (sc://localhost:15002)
      - "127.0.0.1:4040:4040"   # Spark UI
    depends_on:
      lakekeeper: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/15002'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 8g

  clickhouse:
    profiles: [clickhouse]
    image: clickhouse/clickhouse-server:26.8.34.13
    <<: *secrets
    environment:
      # Local playground: the passwordless `default` user may connect from the Compose network.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:8123:8123" # HTTP (and the built-in web SQL UI at /play)
      - "127.0.0.1:9000:9000" # native protocol
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - ./docker/clickhouse/config.d/playground.xml:/etc/clickhouse-server/config.d/playground.xml:ro
      - ./docker/clickhouse/users.d/playground.xml:/etc/clickhouse-server/users.d/playground.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      seaweedfs: {condition: service_healthy}
      lakekeeper: {condition: service_healthy}
    mem_limit: 4g

  kafka:
    profiles: [streaming]
    image: apache/kafka:4.3.2
    environment:
      # Single node in KRaft mode: one process is both broker and controller (no ZooKeeper).
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: containers reach kafka:29092, the host reaches localhost:9092.
      KAFKA_LISTENERS: PLAINTEXT://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9092:9092"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g

  kafka-ui:
    profiles: [streaming]
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: playground
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      kafka: {condition: service_healthy}
    mem_limit: 512m

  flink-jobmanager:
    profiles: [streaming]
    build:
      context: docker/flink
    image: de-playground/flink:2.0.1
    <<: *secrets
    command: ["jobmanager"]
    ports: ["127.0.0.1:8081:8081"] # Flink web UI + REST
    volumes: &flink-volumes
      - ./src:/opt/playground/src:ro
      - flinkcheckpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      kafka: {condition: service_healthy}
      lakekeeper: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 1536m

  flink-taskmanager:
    profiles: [streaming]
    image: de-playground/flink:2.0.1
    <<: *secrets
    command: ["taskmanager"]
    volumes: *flink-volumes
    depends_on:
      flink-jobmanager: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 3g

  flink-sql-gateway:
    profiles: [streaming]
    image: de-playground/flink:2.0.1
    <<: *secrets
    command: ["/opt/flink/bin/sql-gateway.sh", "start-foreground",
              "-Dsql-gateway.endpoint.rest.address=0.0.0.0", "-Drest.address=flink-jobmanager"]
    ports: ["127.0.0.1:8083:8083"] # SQL Gateway REST (v3)
    volumes: *flink-volumes
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      flink-jobmanager: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 1g

  spark-stream:
    profiles: [spark-stream]
    image: de-playground/runner:local
    <<: *secrets
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["uv", "run", "python", "-m", "de_playground.streaming", "spark-stream"]
    depends_on:
      spark-connect: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 30s # SIGTERM stops the queries on the Spark Connect server
    mem_limit: 512m

  producer:
    profiles: [streaming]
    image: de-playground/runner:local
    <<: *secrets
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["uv", "run", "python", "-m", "de_playground.streaming", "produce", "--source", "auto"]
    depends_on:
      kafka: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m

  runner:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    image: de-playground/runner:local
    <<: *secrets
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
      lakekeeper: {condition: service_healthy}
    mem_limit: 4g

volumes:
  clickhousedata:
  flinkcheckpoints:
  kafkadata:
  pgdata:
  seaweeddata:
  sparkcheckpoints:
