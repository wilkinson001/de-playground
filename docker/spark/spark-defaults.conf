# Single-container Spark: driver + executors in one JVM (local mode), served over Spark Connect.
spark.master                                  local[6]
spark.driver.memory                           6g
spark.sql.session.timeZone                    UTC
spark.connect.grpc.binding.port               15002
spark.ui.port                                 4040

# Both lakehouse formats in one session
spark.sql.extensions                          io.delta.sql.DeltaSparkSessionExtension,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
# spark_catalog handles Delta (path-based tables: delta.`s3a://delta/...`)
spark.sql.catalog.spark_catalog               org.apache.spark.sql.delta.catalog.DeltaCatalog

# Iceberg tables live in the Lakekeeper REST catalog, warehouse "lakehouse"
spark.sql.catalog.iceberg                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                rest
spark.sql.catalog.iceberg.uri                 http://lakekeeper:8181/catalog
spark.sql.catalog.iceberg.warehouse           lakehouse
spark.sql.catalog.iceberg.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint         http://seaweedfs:8333
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.client.region       us-east-1

# S3A (Delta tables and raw files) against SeaweedFS
spark.hadoop.fs.s3a.endpoint                  http://seaweedfs:8333
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.endpoint.region           us-east-1
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
