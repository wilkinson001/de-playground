# Flink 2.x configuration (replaces flink-conf.yaml). Replaces the image's conf/config.yaml.
env:
  java:
    opts:
      # Copied verbatim from flink:2.0.1's default config.yaml. Java 17 needs these module
      # opens: without them Kryo can't serialise Iceberg's write results and every checkpoint
      # fails (InaccessibleObjectException: java.nio.ByteBuffer.hb).
      all: --add-exports=java.base/sun.net.util=ALL-UNNAMED --add-exports=java.rmi/sun.rmi.registry=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED
jobmanager:
  rpc:
    address: flink-jobmanager
  bind-host: 0.0.0.0
  memory:
    process:
      size: 1280m
taskmanager:
  bind-host: 0.0.0.0
  numberOfTaskSlots: 4
  memory:
    process:
      size: 2560m
rest:
  address: flink-jobmanager
  bind-address: 0.0.0.0
parallelism:
  default: 1
execution:
  checkpointing:
    interval: 30s
    dir: file:///opt/flink/checkpoints
    savepoint-dir: file:///opt/flink/checkpoints/savepoints
state:
  backend:
    type: hashmap
python:
  executable: python3
  client:
    executable: python3
table:
  exec:
    source:
      # Keyed Wikimedia traffic leaves some Kafka partitions quiet; without this an idle
      # partition holds the watermark back and windows never close.
      idle-timeout: 10s
classloader:
  # Hadoop's Configuration captures the thread's context classloader when created, and its codec
  # pool caches one: a later job (e.g. Iceberg gzip-compressing metadata after a Delta write) then
  # touches the previous job's closed user-code classloader. All connector jars live in lib/
  # (parent classloader), so there is no real user code to leak; this is Flink's documented
  # setting for Hadoop-backed connectors.
  check-leaked-classloader: false
