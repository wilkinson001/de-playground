[project]
name = "de-playground"
version = "0.1.0"
description = "Local data engineering playground"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "clickhouse-connect>=0.8",
    "confluent-kafka==2.15.0",
    "deltalake>=1.1",
    "duckdb==1.5.6",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "pyiceberg[pyarrow]>=0.10",
    "pyspark-client==4.0.1",
]

[dependency-groups]
dev = [
    "moto[s3]>=5",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/de_playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs the running Compose stack (run via make test-integration)"]
